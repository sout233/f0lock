[package]
edition = "2024"
name = "egui-baseview"
version = "0.9.0"
authors = ["Billy Messenger <billydm@noreply.codeberg.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A baseview backend for egui"
readme = "README.md"
keywords = [
    "nice-plug",
    "plugin",
    "clap",
    "vst",
    "vst3",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/RustAudio/egui-baseview"

[features]
dpi-trace = ["dep:windows-sys"]
default = [
    "opengl",
    "tracing",
]
keyboard_focus_workaround = []
log = ["dep:log"]
opengl = [
    "dep:egui_glow",
    "baseview/opengl",
]
tracing = [
    "dep:tracing",
    "baseview/tracing",
]
wgpu = [
    "dep:egui-wgpu",
    "dep:pollster",
    "dep:wgpu",
]

[lib]
name = "egui_baseview"
path = "src/lib.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "render_test"
path = "examples/render_test.rs"

[[example]]
name = "simple_demo"
path = "examples/simple_demo.rs"

[[example]]
name = "zoom_factor"
path = "examples/zoom_factor.rs"

[dependencies.baseview]
version = "0.4.1"

[dependencies.copypasta]
version = "0.10"
features = ["x11"]
default-features = false

[dependencies.egui]
version = "0.37.0"
features = ["bytemuck"]
default-features = false

[dependencies.egui-wgpu]
version = "0.37.0"
features = ["x11"]
optional = true
default-features = false

[dependencies.egui_glow]
version = "0.37.0"
features = ["x11"]
optional = true

[dependencies.keyboard-types]
version = "0.8.3"
default-features = false

[dependencies.log]
version = "0.4"
optional = true

[dependencies.open]
version = "5.4.1"

[dependencies.pollster]
version = "1.0"
optional = true

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.wgpu]
version = "30"
optional = true
default-features = false
features = ["std", "parking_lot", "wgsl"]

[target.'cfg(windows)'.dependencies.wgpu]
version = "30"
optional = true
default-features = false
features = ["dx12"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
optional = true
